  <title>Linger - Instrumento Visual Web</title>

  <!-- Controles expresivos en pantalla para la interpretación -->
  <div id="ui-overlay">
    <h2>Linger — Visual Instrument</h2>
    <p><strong>[Mover Mouse]:</strong> Dirigir el Agente Voz (Seek / Arrive)</p>
    <p><strong>[Clic Sostenido]:</strong> Dispersar Agente Voz (Flee / Tensión)</p>
    <p><strong>[Espacio]:</strong> Cambiar tiempo de persistencia de la huella (Physarum)</p>
