<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulación Physarum - Onda de Agua & Physarum</title>
  
  <!-- Librerías p5.js y p5.sound -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

  <!-- Panel de Control UI -->
  <div id="controls-container">
    <h2>Simulación Physarum & Gota de Agua</h2>
    <p>Presiona <strong>Q</strong> para cambiar de color y <strong>W</strong> para generar una gota de agua.</p>

    <div class="control-group">
      <label for="audio-upload" class="custom-file-upload">📁 Cargar archivo de audio</label>
      <input type="file" id="audio-upload" accept="audio/*">
      <span id="file-name">Ningún archivo cargado</span>
    </div>

    <div class="button-group">
      <button id="btn-play">▶ Reproducir / Pausa</button>
      <button id="btn-hide">👁 Ocultar Interfaz</button>
    </div>

    <div id="status-message">Modo: Esperando archivo de audio...</div>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
